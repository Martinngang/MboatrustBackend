<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mboa Trust — Fund Project (Mock)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Fund Project (Mock)</h1>

      <section class="form">
        <label>Backend base URL
          <input id="backendUrl" type="text" value="http://localhost:5000" />
        </label>

        <label>Dev user id (x-dev-user-id header)
          <input id="devUserId" type="text" placeholder="Optional for auth bypass" />
        </label>

        <label>Project ID
          <input id="projectId" type="text" placeholder="Enter project id" />
        </label>

        <label>Payment method
          <select id="paymentProvider">
            <optgroup label="International payment">
              <option value="flutterwave">Card / Bank (Flutterwave mock)</option>
            </optgroup>
            <optgroup label="Cameroon mobile money">
              <option value="mtn_momo">MTN MoMo</option>
              <option value="orange_money">Orange Money</option>
            </optgroup>
          </select>
        </label>

        <label>Currency
          <select id="currency">
            <option>USD</option>
            <option>EUR</option>
            <option>GBP</option>
            <option>XAF</option>
          </select>
        </label>

        <label>Amount
          <input id="amount" type="number" min="0" value="50" />
        </label>

        <label id="payerPhoneLabel">Payer phone number (required for MoMo)
          <input id="payerPhone" type="text" placeholder="+2376xxxxxxx" />
        </label>

        <div class="summary">
          <h2>Summary</h2>
          <div id="summaryLines"></div>
        </div>

        <button id="confirm">Confirm and Pay</button>

        <div id="result" class="result"></div>
      </section>

      <section class="history">
        <h2>Transaction history (mocked display)</h2>
        <div id="history"></div>
      </section>

      <footer>
        <small>Tooltip: Pay with your card from anywhere — we handle the transfer to Cameroon via mobile money.</small>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
